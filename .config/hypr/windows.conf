# Special windowrules for specific applications

# this is to remove size constraints
windowrule = no_max_size on, match:class steam, match:title Steam
windowrule = no_max_size on, match:class steam, match:title "Friends List"

# remove the center constraint
#windowrule = center on, match:class steam, match:title Steam
windowrule = float false, match:class steam

windowrule = workspace 6, match:initial_class ^(steam).*
windowrule = workspace 5, match:class steam
windowrule = opacity 1 1, match:class steam
windowrule = idle_inhibit fullscreen, match:class steam
windowrule = no_initial_focus on, match:class steam
windowrule = no_focus on, match:class steam, match:title ^(notificationtoasts).*
windowrule = workspace 5 silent, match:class ^(window)$

# spotify, thunderbird-esr
windowrule = workspace 2, match:class Spotify
windowrule = workspace 2, match:class thunderbird-esr

# resources
windowrule = float true, match:class net.nokyan.Resources

# brave
windowrule = workspace 5, match:class brave-browser

master {
    mfact = 0.3          # master area = 30% width
    orientation = left   # master column on the left
    new_status = slave   # new windows don't bump master
}

workspace = 0, layout:master

# firefox
windowrule = workspace 0, match:class firefox-esr

# slack
windowrule = workspace 0 silent, match:class com.slack.Slack

# floating windows (system)
windowrule = size 1920 1080, match:tag floating-window
